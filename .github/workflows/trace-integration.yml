name: Trace integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'sandbox/**'
      - 'src/containerizer/trace/**'
      - 'tests/integration/trace/**'
      - 'tests/fixtures/trace/**'
      - '.github/workflows/trace-integration.yml'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'sandbox/**'
      - 'src/containerizer/trace/**'
      - 'tests/integration/trace/**'
      - 'tests/fixtures/trace/**'
      - '.github/workflows/trace-integration.yml'
      - 'pyproject.toml'

permissions:
  contents: read

concurrency:
  group: trace-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trace-integration:
    name: Trace integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install podman and trace tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y podman bpfcc-tools bpftrace strace
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run trace integration test
        run: pytest -m integration -v --no-cov
