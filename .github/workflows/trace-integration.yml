name: Trace integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'sandbox/**'
      - 'src/containerizer/trace/**'
      - 'tests/integration/trace/**'
      - 'tests/fixtures/trace/**'
      - '.github/workflows/trace-integration.yml'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'sandbox/**'
      - 'src/containerizer/trace/**'
      - 'tests/integration/trace/**'
      - 'tests/fixtures/trace/**'
      - '.github/workflows/trace-integration.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trace-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trace-integration:
    name: Trace integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install podman and trace tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y podman bpfcc-tools bpftrace strace
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compute runner image tag
        id: tag
        run: |
          TAG=$(python -c "from pathlib import Path; from containerizer.trace.image import RunnerImage; print(RunnerImage(sandbox_dir=Path('sandbox/runner_image')).tag)")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Restore runner image from cache
        id: restore-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: /tmp/runner-image.tar
          key: runner-image-${{ hashFiles('sandbox/runner_image/**') }}
      - name: Load cached runner image
        if: steps.restore-cache.outputs.cache-hit == 'true'
        run: podman load -i /tmp/runner-image.tar
      - name: Build runner image (cache miss)
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: |
          podman build -t "${{ steps.tag.outputs.tag }}" sandbox/runner_image
          podman save -o /tmp/runner-image.tar "${{ steps.tag.outputs.tag }}"
      - name: Save runner image cache
        if: steps.restore-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: /tmp/runner-image.tar
          key: runner-image-${{ hashFiles('sandbox/runner_image/**') }}
      - name: Pre-load runner image into rootful podman store
        run: sudo podman load -i /tmp/runner-image.tar
      - name: Run trace integration test
        run: sudo -E env "PATH=$PATH" pytest -m integration -v --no-cov
      - name: Dump trace dir on failure
        if: failure()
        run: |
          shopt -s nullglob
          for d in /tmp/pytest-of-root/pytest-*/test_trace_pipeline_*/trace; do
            echo "=== $d ==="
            sudo ls -la "$d"
            for f in "$d"/*.err "$d"/install.log "$d"/FALLBACKS.json "$d"/installer.exitcode "$d"/install.status; do
              [ -e "$f" ] || continue
              echo "--- $(basename "$f") ---"
              sudo cat "$f" 2>&1 | head -50
            done
          done
