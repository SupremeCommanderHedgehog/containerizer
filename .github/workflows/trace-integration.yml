name: Trace integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'sandbox/**'
      - 'src/containerizer/trace/**'
      - 'tests/integration/trace/**'
      - 'tests/fixtures/trace/**'
      - '.github/workflows/trace-integration.yml'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'sandbox/**'
      - 'src/containerizer/trace/**'
      - 'tests/integration/trace/**'
      - 'tests/fixtures/trace/**'
      - '.github/workflows/trace-integration.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trace-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trace-integration:
    name: Trace integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install podman and trace tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y podman bpfcc-tools bpftrace strace \
            "linux-headers-$(uname -r)"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compute runner image tag
        id: tag
        run: |
          TAG=$(python -c "from pathlib import Path; from containerizer.trace.image import RunnerImage; print(RunnerImage(sandbox_dir=Path('sandbox/runner_image')).tag)")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Restore runner image from cache
        id: restore-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: /tmp/runner-image.tar
          key: runner-image-${{ hashFiles('sandbox/runner_image/**') }}
      - name: Load cached runner image
        if: steps.restore-cache.outputs.cache-hit == 'true'
        run: podman load -i /tmp/runner-image.tar
      - name: Build runner image (cache miss)
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: |
          podman build -t "${{ steps.tag.outputs.tag }}" sandbox/runner_image
          podman save -o /tmp/runner-image.tar "${{ steps.tag.outputs.tag }}"
      - name: Save runner image cache
        if: steps.restore-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: /tmp/runner-image.tar
          key: runner-image-${{ hashFiles('sandbox/runner_image/**') }}
      - name: Pre-load runner image into rootful podman store
        run: sudo podman load -i /tmp/runner-image.tar
      - name: Run trace integration test
        run: sudo -E env "PATH=$PATH" pytest -m integration -v --no-cov
      - name: Dump trace dir contents (always — verify #77)
        if: always()
        run: |
          set +e
          tdir=$(sudo find /tmp/pytest-of-root -maxdepth 4 -name 'trace' -type d 2>/dev/null | head -1)
          if [ -z "$tdir" ]; then
            echo "(no trace dir found anywhere)"
            exit 0
          fi
          echo "=== $tdir ==="
          sudo ls -la "$tdir"
          echo "--- FALLBACKS.json ---"
          sudo cat "$tdir/FALLBACKS.json" 2>/dev/null
          echo
          echo "--- connect.err (full) ---"
          sudo cat "$tdir/connect.err" 2>/dev/null
          echo "--- accept.err (full) ---"
          sudo cat "$tdir/accept.err" 2>/dev/null
      - name: Dump trace dir on failure
        if: failure()
        run: |
          shopt -s nullglob
          d=/tmp/trace-debug-dump
          if [ ! -d "$d" ]; then
            echo "(no $d — test did not reach the dump path)"
            exit 0
          fi
          echo "=== $d ==="
          sudo ls -la "$d"
          # For *.err show head AND tail: bcc compiles emit a lot of warning
          # noise before the actual error, so 4000 chars of head misses it.
          for f in "$d"/*.err; do
            [ -e "$f" ] || continue
            echo "--- $(basename "$f") (head 1500) ---"
            sudo head -c 1500 "$f"
            echo
            echo "--- $(basename "$f") (tail 3000) ---"
            sudo tail -c 3000 "$f"
            echo
          done
          for f in "$d"/install.log "$d"/FALLBACKS.json "$d"/installer.exitcode "$d"/install.status "$d"/*.jsonl; do
            [ -e "$f" ] || continue
            echo "--- $(basename "$f") ---"
            sudo head -c 4000 "$f"
            echo
          done
      - name: Upload trace debug dump
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: trace-debug-dump
          path: /tmp/trace-debug-dump
          if-no-files-found: ignore
