name: Trace integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'sandbox/**'
      - 'src/containerizer/trace/**'
      - 'tests/integration/trace/**'
      - 'tests/fixtures/trace/**'
      - '.github/workflows/trace-integration.yml'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'sandbox/**'
      - 'src/containerizer/trace/**'
      - 'tests/integration/trace/**'
      - 'tests/fixtures/trace/**'
      - '.github/workflows/trace-integration.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trace-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trace-integration:
    name: Trace integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install podman and trace tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y podman bpfcc-tools bpftrace strace
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compute runner image tag
        id: tag
        run: |
          TAG=$(python -c "from pathlib import Path; from containerizer.trace.image import RunnerImage; print(RunnerImage(sandbox_dir=Path('sandbox/runner_image')).tag)")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Restore runner image from cache
        id: restore-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: /tmp/runner-image.tar
          key: runner-image-${{ hashFiles('sandbox/runner_image/**') }}
      - name: Load cached runner image
        if: steps.restore-cache.outputs.cache-hit == 'true'
        run: podman load -i /tmp/runner-image.tar
      - name: Build runner image (cache miss)
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: |
          podman build -t "${{ steps.tag.outputs.tag }}" sandbox/runner_image
          podman save -o /tmp/runner-image.tar "${{ steps.tag.outputs.tag }}"
      - name: Save runner image cache
        if: steps.restore-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: /tmp/runner-image.tar
          key: runner-image-${{ hashFiles('sandbox/runner_image/**') }}
      - name: Diagnose container view of tracing mounts (sudo podman)
        run: |
          echo "## inside the runner container under sudo podman ##"
          sudo podman load -i /tmp/runner-image.tar 2>&1 | head -2 || true
          sudo podman run --rm --privileged --pid=host \
            -v /sys/kernel/debug:/sys/kernel/debug \
            -v /sys/kernel/tracing:/sys/kernel/tracing \
            --entrypoint /bin/sh \
            "${{ steps.tag.outputs.tag }}" \
            -c 'echo "[container] /sys/kernel/debug count:"; ls /sys/kernel/debug/ 2>&1 | wc -l; \
                echo "[container] /sys/kernel/tracing count:"; ls /sys/kernel/tracing/ 2>&1 | wc -l; \
                echo "[container] bpftrace -l raw_syscalls (first 3):"; \
                bpftrace -l "tracepoint:raw_syscalls:*" 2>&1 | head -3' || true
      - name: Run trace integration test
        run: sudo -E env "PATH=$PATH" pytest -m integration -v --no-cov
