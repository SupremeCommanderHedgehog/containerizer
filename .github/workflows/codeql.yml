name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "37 8 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL analyze (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          languages: python
          queries: security-and-quality
      # Code scanning requires GitHub Advanced Security on personal private
      # repos. Until GHAS is enabled, the SARIF upload step inside analyze
      # returns a 404 ("Code scanning is not enabled for this repository")
      # and fails the job. Marking the step continue-on-error keeps the
      # workflow green so it does not block PRs; CodeQL still runs and its
      # findings appear in the workflow log. Remove this once GHAS is on.
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        continue-on-error: true
        with:
          category: "/language:python"
