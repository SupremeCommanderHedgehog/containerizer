name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "37 8 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL analyze (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357  # v3.36.2
        with:
          languages: python
          queries: security-and-quality
      # Code scanning requires GitHub Advanced Security on personal private
      # repos. Until GHAS is enabled, the SARIF upload step inside analyze
      # returns a 404 ("Code scanning is not enabled for this repository")
      # and fails the job. Marking the step continue-on-error keeps the
      # workflow green so it does not block PRs; CodeQL still runs and its
      # findings appear in the workflow log. Remove this once GHAS is on.
      - uses: github/codeql-action/analyze@dd903d2e4f5405488e5ef1422510ee31c8b32357  # v3.36.2
        continue-on-error: true
        with:
          category: "/language:python"
